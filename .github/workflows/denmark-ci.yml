name: Denmark CCTV checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/cctv/**'
      - 'src/components/CameraViewer.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/denmark-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed CCTV files
        run: npx eslint src/app/api/cctv/denmark.ts src/app/api/cctv/route.ts src/app/api/cctv/proxy/route.ts src/components/CameraViewer.tsx
      - name: Run tests
        run: npm test
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
