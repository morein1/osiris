name: Denmark CCTV checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/cctv/**'
      - 'src/components/CameraViewer.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/denmark-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint new Denmark camera module and proxy
        run: npx eslint src/app/api/cctv/denmark.ts src/app/api/cctv/proxy/route.ts
      - name: Run tests that do not require Redis or PostgreSQL
        run: npx vitest run --exclude src/lib/cache.test.ts --exclude src/lib/rateLimit.test.ts --exclude src/lib/feedStore.test.ts --exclude src/lib/db/postgres.test.ts
      - name: TypeScript typecheck
        if: success() || failure()
        run: npx tsc --noEmit
      - name: Production build
        if: success() || failure()
        run: npm run build
