name: Cache timeout checks

on:
  pull_request:
    paths:
      - 'src/lib/db/postgres.ts'
      - 'src/lib/db/redis.ts'
      - '.github/workflows/cache-timeout-ci.yml'
  push:
    branches:
      - fix-cache-connection-timeouts
    paths:
      - 'src/lib/db/postgres.ts'
      - 'src/lib/db/redis.ts'
      - '.github/workflows/cache-timeout-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
